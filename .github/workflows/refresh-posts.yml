name: Refresh Substack posts

on:
  schedule:
    - cron: '21 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Substack posts
        run: python blog/update_posts.py
      - name: Commit updated article index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog/posts.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Substack article index'
            git push
          fi
